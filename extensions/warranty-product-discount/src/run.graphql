query RunInput {
  cart {
    lines {
      id
      quantity
      cost {
        amountPerQuantity {
          amount
          currencyCode
        }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          title
          product {
            id
            title
            productType
            hasWarrantyServiceTag: hasAnyTag(tags: ["warranty-service"])
            isWarrantyEligible: hasAnyTag(tags: ["warranty-eligible"])
            priceMultiplierMetafield: metafield(namespace: "warranty", key: "price_multiplier") {
              value
            }
          }
        }
      }
      attribute(key: "_protects_product_id") {
        value
      }
    }
  }
  discountNode {
    metafield(namespace: "$app:warranty", key: "function-configuration") {
      value
    }
  }
}
